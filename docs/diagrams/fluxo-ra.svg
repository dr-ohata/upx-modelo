  <text x="55" y="98" font-family="Arial" font-size="18">Exemplo: Image Tracking</text>
  <g font-family="Arial" text-anchor="middle">
    <g fill="#fff" stroke="#333" stroke-width="2">
      <rect x="45" y="180" width="170" height="90" rx="14"/>
      <rect x="250" y="180" width="170" height="90" rx="14"/>
      <rect x="455" y="180" width="170" height="90" rx="14"/>
      <rect x="660" y="180" width="170" height="90" rx="14"/>
      <rect x="865" y="180" width="170" height="90" rx="14"/>
      <rect x="1070" y="180" width="170" height="90" rx="14"/>
