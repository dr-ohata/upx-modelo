    </g>
    <g font-size="20">
      <text x="130" y="215">Câmera</text><text x="130" y="243" font-size="16">captura</text>
      <text x="335" y="215">Análise</text><text x="335" y="243" font-size="16">ARCore</text>
      <text x="540" y="215">Comparação</text><text x="540" y="243" font-size="16">referência</text>
      <text x="745" y="215">Detecção</text><text x="745" y="243" font-size="16">tracking</text>
      <text x="950" y="215">Posição</text><text x="950" y="243" font-size="16">pose</text>
      <text x="1155" y="215">Conteúdo</text><text x="1155" y="243" font-size="16">3D / UI</text>
      <text x="1320" y="215">Uso</text><text x="1320" y="243" font-size="16">interação</text>
