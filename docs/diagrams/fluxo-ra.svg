  <text x="55" y="380" font-family="Arial" font-size="21">A documentação da equipe deve explicar qual técnica de RA utiliza, quais componentes executam cada etapa e o que ocorre quando o reconhecimento falha.</text>
  <text x="55" y="418" font-family="Arial" font-size="19">Não basta indicar “usa RA”: registre o fluxo técnico real implementado.</text>
